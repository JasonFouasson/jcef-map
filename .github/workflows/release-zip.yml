name: Release plugin ZIP

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        run: |
          STAGE=dist/wp-interactive-map-jce
          mkdir -p "$STAGE"
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.cursor' \
            --exclude '.DS_Store' \
            --exclude 'dist' \
            ./ "$STAGE"/
          cd dist
          zip -r wp-interactive-map-jce.zip wp-interactive-map-jce

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wp-interactive-map-jce.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
